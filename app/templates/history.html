{% extends "base.html" %}
{% block title %}Workout History{% endblock %}
{% block content %}
{% for workout in workouts %}
    <p>{{workout.exercise_name}} - {{workout.weight}} - {{workout.sets}}x{{workout.reps}} - {{workout.date}}</p>
    <a href="{{ url_for('delete_workout', workout_id=workout.id) }}">Delete</a>
{% endfor %}
{% endblock %}
