{% extends "base.html" %}
{% block title %}{{exercise_name}} Progress{% endblock %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<canvas id="myChart"></canvas>
<script>
    const ctx = document.getElementById("myChart");
    new Chart(ctx, {
        type: "line",
        data: {
            labels: {{ dates | tojson }},
            datasets: [{
                label: "{{ exercise_name }}",
                data: {{ weights | tojson }},
            }]
        }
    });
</script>

{% endblock %}
